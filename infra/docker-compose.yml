services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebase-navigator-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: codebase-navigator-redis
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: ../apps/api-gateway
    container_name: codebase-api-gateway
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://127.0.0.1:5173

      REDIS_URL: redis://redis:6379

      INGESTION_SERVICE_URL: http://ingestion-service:5001
      QA_SERVICE_URL: http://qa-service:5002
      AGENT_ORCHESTRATOR_URL: http://agent-orchestrator:5003

    depends_on:
      - redis
      - ingestion-service
      - qa-service
      - agent-orchestrator

  ingestion-service:
    build:
      context: ../services/ingestion-service
    container_name: codebase-ingestion
    ports:
      - "5001:5001"

    environment:
      NODE_ENV: production
      PORT: 5001

      # Redis / BullMQ
      REDIS_URL: redis://redis:6379

      # AWS S3
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

      # Qdrant
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # HuggingFace
      HF_CACHE_DIR: /app/.cache/huggingface

      # Agent Orchestrator
      AGENT_ORCHESTRATOR_URL: http://agent-orchestrator:5003

    depends_on:
      - redis
      - agent-orchestrator

  qa-service:
    build:
      context: ../services/qa-service
    container_name: codebase-qa
    ports:
      - "5002:5002"

    environment:
      NODE_ENV: production
      PORT: 5002

      # Qdrant
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Ingestion Service
      INGESTION_SERVICE_URL: http://ingestion-service:5001

      # HuggingFace
      HF_CACHE_DIR: /app/.cache/huggingface

    depends_on:
      - ingestion-service

  agent-orchestrator:
    build:
      context: ../services/agent-orchestrator
    container_name: codebase-agent-orchestrator
    ports:
      - "5003:5003"

    environment:
      NODE_ENV: production
      PORT: 5003

      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  # Persistent Qdrant volume
volumes:
  qdrant_data: